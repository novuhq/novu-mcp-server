name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v). Leave blank to use the value already in server.json."
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync version into server.json
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [ -n "$VERSION" ]; then
            echo "Setting server.json version to $VERSION"
            jq --arg v "$VERSION" '.version = $v' server.json > server.json.tmp
            mv server.json.tmp server.json
          fi
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --help

      - name: Validate server.json
        run: mcp-publisher validate server.json

      - name: Authenticate via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish
